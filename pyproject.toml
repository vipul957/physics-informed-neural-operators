[project]
name = "physics_informed_neural_operators"
version = "0.1.0"
description = "Blueprints for PINNs, neural operators, differentiable PDE solvers, and scientific deep learning."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
